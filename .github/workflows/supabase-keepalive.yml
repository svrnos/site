name: Supabase keep-alive

on:
  schedule:
    # Twice weekly — Monday + Thursday 09:00 UTC.
    # Supabase pauses after 7 days inactivity; 3-4 day gaps give
    # buffer if a single Actions run fails.
    - cron: '0 9 * * 1,4'
  workflow_dispatch:  # manual trigger button in the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping svrnos-docs
        run: |
          curl -sS -X POST "https://rqyjnkvkkjqszgessaxv.supabase.co/rest/v1/rpc/heartbeat" \
            -H "apikey: ${{ secrets.SUPABASE_SVRNOS_DOCS_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SVRNOS_DOCS_KEY }}" \
            -H "Content-Type: application/json" \
            --data '{}' \
            --fail-with-body

      - name: Ping sim95-prod
        run: |
          curl -sS -X POST "https://ifkdqremxgudfqgvvfki.supabase.co/rest/v1/rpc/heartbeat" \
            -H "apikey: ${{ secrets.SUPABASE_SIM95_PROD_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SIM95_PROD_KEY }}" \
            -H "Content-Type: application/json" \
            --data '{}' \
            --fail-with-body
